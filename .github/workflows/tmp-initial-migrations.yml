# Temporary: generates the host's first EF migrations on GitHub's runner and commits them
# back to this branch. Removed again before the pull request is merged.
name: Generate initial migrations (temporary)

on:
  push:
    branches: [feature/identity-server-host]

permissions:
  contents: write
  packages: read

env:
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skip if migrations already exist
        id: check
        run: |
          if [ -d src/BJK.Idsrv.Host/Data/Migrations ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@v5
        if: steps.check.outputs.exists != 'true'
        with:
          global-json-file: global.json

      - name: Generate migrations
        if: steps.check.outputs.exists != 'true'
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          annotate() { echo "::error::$(tail -40 "$1" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          dotnet tool restore
          dotnet restore BJK.Idsrv.slnx > restore.log 2>&1 || { annotate restore.log; exit 1; }
          dotnet ef migrations add InitialIdentity \
            --project src/BJK.Idsrv.Host --context BjkIdentityDbContext \
            --output-dir Data/Migrations/Identity > ef1.log 2>&1 || { annotate ef1.log; exit 1; }
          dotnet ef migrations add InitialPersistedGrants \
            --project src/BJK.Idsrv.Host --context PersistedGrantDbContext \
            --output-dir Data/Migrations/PersistedGrants > ef2.log 2>&1 || { annotate ef2.log; exit 1; }

      - name: Commit migrations
        if: steps.check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BJK.Idsrv.Host/Data/Migrations
          git commit -m "Add initial Identity and IdentityServer migrations (generated by dotnet ef)"
          git push
