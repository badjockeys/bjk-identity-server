# Temporary: generates the migration that adds the Data Protection keys table, on GitHub's runner,
# and commits it back to this branch. Removed again before the pull request is merged.
name: Generate Data Protection migration (temporary)

on:
  push:
    branches: [feature/login-ui]

permissions:
  contents: write
  packages: read

env:
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Skip if the migration already exists
        id: check
        run: |
          if ls src/BJK.Idsrv.Host/Data/Migrations/Identity/*_DataProtectionKeys.cs >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-dotnet@v5
        if: steps.check.outputs.exists != 'true'
        with:
          global-json-file: global.json

      - name: Generate migration
        if: steps.check.outputs.exists != 'true'
        env:
          ASPNETCORE_ENVIRONMENT: Development
          # Never connected to: generating a migration only needs the model.
          ConnectionStrings__IdentityDatabase: Server=(design-time);Database=idsrv
        run: |
          annotate() { echo "::error::$(grep -E 'error|Error|Exception' "$1" | sort -u | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; }
          dotnet tool restore
          dotnet restore BJK.Idsrv.slnx > restore.log 2>&1 || { annotate restore.log; exit 1; }
          dotnet build BJK.Idsrv.slnx --no-restore > build.log 2>&1 || { annotate build.log; exit 1; }
          dotnet ef migrations add DataProtectionKeys --no-build \
            --project src/BJK.Idsrv.Host --context BjkIdentityDbContext \
            --output-dir Data/Migrations/Identity > ef.log 2>&1 || { annotate ef.log; exit 1; }

      - name: Commit migration
        if: steps.check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BJK.Idsrv.Host/Data/Migrations
          git commit -m "Add DataProtectionKeys migration (generated by dotnet ef)"
          git push
