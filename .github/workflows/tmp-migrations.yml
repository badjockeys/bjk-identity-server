# Temporary: generates the EF migration for this branch's model changes. Removed before review.
name: tmp-migrations
on:
  push:
    branches: [feature/mobile-number]
permissions:
  contents: write
  packages: read
env:
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
  ASPNETCORE_ENVIRONMENT: Development
  ConnectionStrings__IdentityDatabase: Server=localhost,1433;Database=idsrv;User Id=sa;Password=x;TrustServerCertificate=True
  ConnectionStrings__Messaging: Server=localhost,1433;Database=badjockeys;User Id=sa;Password=x;TrustServerCertificate=True
  Messaging__ConnectionStringName: Messaging
  Messaging__CreateTables: "false"
  Email__FromAddress: no-reply@badjockeys.local
  Email__PasswordResetUrl: http://localhost:3000/reset-password
  Captcha__TurnstileSecretKey: 1x0000000000000000000000000000000AA
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build and add the migration
        continue-on-error: true
        run: |
          exec > >(tee migration.log) 2>&1
          set -e
          dotnet restore BJK.Idsrv.slnx && dotnet tool restore
          dotnet build BJK.Idsrv.slnx --configuration Release --no-restore 2>&1 | grep -E "error|Build succeeded" || true
          dotnet test BJK.Idsrv.slnx --configuration Release --no-build 2>&1 | grep -E "error|Failed|failed|Passed!|Total tests" | head -60 || true
          dotnet ef migrations add MobileNumber --project src/BJK.Idsrv.Host --context BjkIdentityDbContext --output-dir Data/Migrations/Identity --configuration Release
      - name: Push
        if: ${{ always() }}
        run: |
          git add -f migration.log
          git add -A src || true
          git -c user.name=ci -c user.email=ci@example.com commit -m "Generated migration"
          git push origin HEAD:refs/heads/tmp/mobile-number-migrations --force
