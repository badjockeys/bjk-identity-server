name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: read   # BJK.Modules.* from GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credentials for the "badjockeys" source in nuget.config.
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
  # Throwaway passwords for the CI-only SQL Server container below.
  SQL_PASSWORD: Ci-Passw0rd-2026
  ConnectionStrings__IdentityDatabase: Server=localhost,1433;Database=idsrv;User Id=sa;Password=Ci-Passw0rd-2026;TrustServerCertificate=True
  # User lifecycle events go into bjk-core's queue tables (schema messaging of badjockeys), through a login that may
  # only read the subscriptions and add queue rows. The smoke test creates the tables and the login as bjk-core would.
  MESSAGING_LOGIN: bjk_idsrv_messaging
  MESSAGING_PASSWORD: Ci-Messag1ng-2026
  ConnectionStrings__Messaging: Server=localhost,1433;Database=badjockeys;User Id=bjk_idsrv_messaging;Password=Ci-Messag1ng-2026;TrustServerCertificate=True
  Messaging__ConnectionStringName: Messaging
  Messaging__CreateTables: "false"
  # Same settings developers keep in user secrets (see user-secrets.template.json).
  Email__FromAddress: no-reply@badjockeys.local
  Email__PasswordResetUrl: http://localhost:3000/reset-password
  Captcha__TurnstileSecretKey: 1x0000000000000000000000000000000AA   # Cloudflare's public "always passes" test key
  # The public website client, so the smoke test can start a real sign-in.
  Clients__Web__RedirectUris__0: http://localhost:3000/api/auth/callback/bjk
  Clients__Web__Secret: ci-web-secret

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Passw0rd-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Passw0rd-2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          set -o pipefail
          dotnet tool restore
          if ! dotnet restore BJK.Idsrv.slnx 2>&1 | tee restore.log; then
            grep -E "error" restore.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build
        run: dotnet build BJK.Idsrv.slnx --configuration Release --no-restore

      # For the age check's liveness tests against the real YuNet model: ffmpeg, the OpenCV Zoo model (MIT) and a
      # sample photo from OpenCV. If a download fails, those tests are skipped rather than failing the build.
      - name: Fetch ffmpeg and the YuNet model for the liveness tests
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p "$RUNNER_TEMP/yunet"
          curl -fsSL -o "$RUNNER_TEMP/yunet/face_detection_yunet_2023mar.onnx" \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -fsSL -o "$RUNNER_TEMP/yunet/face.jpg" https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg
          echo "YUNET_MODEL_PATH=$RUNNER_TEMP/yunet/face_detection_yunet_2023mar.onnx" >> "$GITHUB_ENV"
          echo "YUNET_TEST_IMAGE=$RUNNER_TEMP/yunet/face.jpg" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          if ! dotnet test --solution BJK.Idsrv.slnx --configuration Release --no-build 2>&1 | tee test-output.txt; then
            grep -iE "error|fail|exception" test-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      # Fails if an entity or configuration changed without a matching migration.
      - name: Check migrations are up to date
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -o pipefail
          for context in BjkIdentityDbContext PersistedGrantDbContext; do
            if ! dotnet ef migrations has-pending-model-changes \
              --project src/BJK.Idsrv.Host --context "$context" \
              --configuration Release --no-build 2>&1 | tee ef-output.txt; then
              tail -15 ef-output.txt | sed 's/^/::error::/'
              exit 1
            fi
          done

      - name: End-to-end smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000
          SQL_CONTAINER: ${{ job.services.sql.id }}
          Logging__Console__FormatterName: simple
          Logging__Console__FormatterOptions__SingleLine: "true"
          Logging__Console__FormatterOptions__ColorBehavior: Disabled
        run: bash pipelines/scripts/smoke-test.sh
