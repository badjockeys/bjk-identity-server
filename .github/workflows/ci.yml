name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: read   # BJK.Modules.* from GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credentials for the "badjockeys" source in nuget.config.
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
  # Throwaway passwords for the CI-only SQL Server container below.
  SQL_PASSWORD: Ci-Passw0rd-2026
  ConnectionStrings__IdentityDatabase: Server=localhost,1433;Database=idsrv;User Id=sa;Password=Ci-Passw0rd-2026;TrustServerCertificate=True
  # User lifecycle events go into bjk-core's queue tables (schema messaging of badjockeys), through a login that may
  # only read the subscriptions and add queue rows. The smoke test creates the tables and the login as bjk-core would.
  MESSAGING_LOGIN: bjk_idsrv_messaging
  MESSAGING_PASSWORD: Ci-Messag1ng-2026
  ConnectionStrings__BadJockeysDatabase: Server=localhost,1433;Database=badjockeys;User Id=bjk_idsrv_messaging;Password=Ci-Messag1ng-2026;TrustServerCertificate=True
  # Same settings developers keep in user secrets (see user-secrets.template.json).
  Email__FromAddress: no-reply@badjockeys.local
  Email__PasswordResetUrl: http://localhost:3000/reset-password
  Captcha__TurnstileSecretKey: 1x0000000000000000000000000000000AA   # Cloudflare's public "always passes" test key
  # The public website client, so the smoke test can start a real sign-in.
  Clients__Web__RedirectUris__0: http://localhost:3000/api/auth/callback/bjk
  Clients__Web__Secret: ci-web-secret

jobs:
  # Whether anything but documentation changed. When only Markdown files or docs/ changed, the jobs below are
  # skipped, which still counts as passing for the required "build" check, so docs-only pull requests can merge
  # without spending minutes on a build.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a new branch, or history that isn't here): build to be safe.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$GITHUB_SHA")
          if grep -qvE '(\.md$|^docs/)' <<< "$files"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "::notice title=Changes::$( [ "$code" = true ] && echo 'Code changed: building.' || echo 'Documentation only: build skipped.')"


  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Passw0rd-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Passw0rd-2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          set -o pipefail
          dotnet tool restore
          if ! dotnet restore BJK.Idsrv.slnx 2>&1 | tee restore.log; then
            grep -E "error" restore.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build
        run: dotnet build BJK.Idsrv.slnx --configuration Release --no-restore

      # For the age check's liveness tests against the real YuNet model: ffmpeg, the OpenCV Zoo model (MIT) and a
      # sample photo from OpenCV. If a download fails, those tests are skipped rather than failing the build.
      - name: Fetch ffmpeg and the YuNet model for the liveness tests
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p "$RUNNER_TEMP/yunet"
          curl -fsSL -o "$RUNNER_TEMP/yunet/face_detection_yunet_2023mar.onnx" \
            https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx
          curl -fsSL -o "$RUNNER_TEMP/yunet/face.jpg" https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg
          echo "YUNET_MODEL_PATH=$RUNNER_TEMP/yunet/face_detection_yunet_2023mar.onnx" >> "$GITHUB_ENV"
          echo "YUNET_TEST_IMAGE=$RUNNER_TEMP/yunet/face.jpg" >> "$GITHUB_ENV"

      - name: Test
        run: |
          set -o pipefail
          if ! dotnet test --solution BJK.Idsrv.slnx --configuration Release --no-build 2>&1 | tee test-output.txt; then
            grep -iE "error|fail|exception" test-output.txt | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      # Fails if an entity or configuration changed without a matching migration.
      - name: Check migrations are up to date
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          set -o pipefail
          for context in BjkIdentityDbContext PersistedGrantDbContext; do
            if ! dotnet ef migrations has-pending-model-changes \
              --project src/BJK.Idsrv.Host --context "$context" \
              --configuration Release --no-build 2>&1 | tee ef-output.txt; then
              tail -15 ef-output.txt | sed 's/^/::error::/'
              exit 1
            fi
          done

      # The image this commit would publish, built for the runner's chip (x86-64) and loaded into Docker so the smoke
      # test runs it. The cache is shared with the publish job's x86-64 build, which reuses these layers.
      - uses: docker/setup-buildx-action@v3

      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BJK.Idsrv.Host/Dockerfile
          platforms: linux/amd64
          load: true
          tags: bjk-identity-server:ci
          secrets: nuget=${{ env.NuGetPackageSourceCredentials_badjockeys }}
          cache-from: type=gha,scope=idsrv-linux-amd64
          cache-to: type=gha,scope=idsrv-linux-amd64,mode=max

      # What the image needs besides the app: the liveness model where the setting points, ffmpeg, and no root.
      - name: Image contents
        run: |
          docker run --rm --entrypoint sh bjk-identity-server:ci -c \
            'test -s "$AgeAssurance__Liveness__ModelPath" && ffmpeg -hide_banner -version | head -1 && test "$(id -u)" != 0' \
            || { echo "::error title=Image::The image is missing the liveness model or ffmpeg, or runs as root."; exit 1; }

      # The smoke test runs the image, not the build output, so what's tested is what's published. The age check
      # uses the Development stand-ins here (an empty model path turns the image's YuNet check off).
      - name: End-to-end smoke test
        env:
          APP_IMAGE: bjk-identity-server:ci
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000
          AgeAssurance__Liveness__ModelPath: ""
          SQL_CONTAINER: ${{ job.services.sql.id }}
          Logging__Console__FormatterName: simple
          Logging__Console__FormatterOptions__SingleLine: "true"
          Logging__Console__FormatterOptions__ColorBehavior: Disabled
        run: bash pipelines/scripts/smoke-test.sh

  # On master only, once everything above has passed: the image for x86-64 (Azure, Windows PCs) and for ARM
  # (Apple silicon Macs), each built on a runner with that chip, pushed to GHCR without a tag yet.
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write   # push to ghcr.io/badjockeys
    steps:
      - uses: actions/checkout@v5

      - name: Platform name
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/BJK.Idsrv.Host/Dockerfile
          platforms: ${{ matrix.platform }}
          secrets: nuget=${{ env.NuGetPackageSourceCredentials_badjockeys }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=bjk-identity-server
            org.opencontainers.image.description=Bad Jockeys identity server
          outputs: type=image,name=ghcr.io/badjockeys/bjk-identity-server,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=idsrv-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=idsrv-${{ env.PLATFORM_PAIR }},mode=max

      - name: Keep the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the two into one image that works on either chip, and tags it with the commit (full and short SHA) and
  # latest. `docker pull ghcr.io/badjockeys/bjk-identity-server:<sha>` then fetches the right one for the machine.
  tag:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/badjockeys/bjk-identity-server
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$SHA" --tag "$IMAGE:${SHA::7}" --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$SHA"
          echo "::notice title=Published::$IMAGE:${SHA::7} (also :$SHA and :latest)"
          {
            echo "### Published"
            echo
            echo "\`$IMAGE:${SHA::7}\`, also tagged \`:$SHA\` and \`:latest\`, for x86-64 and ARM."
          } >> "$GITHUB_STEP_SUMMARY"
