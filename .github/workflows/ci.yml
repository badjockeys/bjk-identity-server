name: CI

on:
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  packages: read   # BJK.Modules.* from GitHub Packages

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Credentials for the "badjockeys" source in nuget.config.
  NuGetPackageSourceCredentials_badjockeys: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}
  # Throwaway password for the CI-only SQL Server container below.
  SQL_PASSWORD: Ci-Passw0rd-2026
  ConnectionStrings__IdentityDatabase: Server=localhost,1433;Database=idsrv;User Id=sa;Password=Ci-Passw0rd-2026;TrustServerCertificate=True
  # Same settings developers keep in user secrets (see user-secrets.template.json).
  Email__FromAddress: no-reply@badjockeys.local
  Email__PasswordResetUrl: http://localhost:3000/reset-password
  Captcha__TurnstileSecretKey: 1x0000000000000000000000000000000AA   # Cloudflare's public "always passes" test key
  Messaging__ConnectionUri: amqp://bjk:ci-rabbit-2026@localhost:5672
  # The public website client, so the smoke test can start a real sign-in.
  Clients__Web__RedirectUris__0: http://localhost:3000/api/auth/callback/bjk
  Clients__Web__Secret: ci-web-secret
  RABBITMQ_MANAGEMENT_URL: http://localhost:15672
  RABBITMQ_USER: bjk
  RABBITMQ_PASSWORD: ci-rabbit-2026

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Passw0rd-2026
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci-Passw0rd-2026 -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
      rabbitmq:
        image: rabbitmq:4-management
        env:
          RABBITMQ_DEFAULT_USER: bjk
          RABBITMQ_DEFAULT_PASS: ci-rabbit-2026
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 10s --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          set -o pipefail
          dotnet tool restore
          if ! dotnet restore BJK.Idsrv.slnx 2>&1 | tee restore.log; then
            grep -E "error" restore.log | sort -u | head -10 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Build
        run: dotnet build BJK.Idsrv.slnx --configuration Release --no-restore

      # Fails if an entity or configuration changed without a matching migration.
      - name: Check migrations are up to date
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          for context in BjkIdentityDbContext PersistedGrantDbContext; do
            dotnet ef migrations has-pending-model-changes \
              --project src/BJK.Idsrv.Host --context "$context" \
              --configuration Release --no-build
          done

      - name: End-to-end smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5000
          SQL_CONTAINER: ${{ job.services.sql.id }}
          Logging__Console__FormatterName: simple
          Logging__Console__FormatterOptions__SingleLine: "true"
          Logging__Console__FormatterOptions__ColorBehavior: Disabled
        run: bash pipelines/scripts/smoke-test.sh
