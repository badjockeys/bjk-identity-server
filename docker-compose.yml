# Local SQL Server and RabbitMQ for development (shared with bjk-core):  docker compose up -d
# Passwords come from .env (git-ignored); copy .env.example to .env first.
# Data is kept in Docker volumes, so it survives restarts.
# To start again from empty:  docker compose down -v
# RabbitMQ dashboard: http://localhost:15672 (user bjk).
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server only ships for x86-64; on Apple Silicon Docker Desktop runs it under Rosetta.
    platform: linux/amd64
    container_name: bjk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${BJK_SQL_PASSWORD:?Set BJK_SQL_PASSWORD in .env - see .env.example}
    ports:
      - "1433:1433"
    volumes:
      - bjk-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: bjk-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bjk
      RABBITMQ_DEFAULT_PASS: ${BJK_RABBITMQ_PASSWORD:?Set BJK_RABBITMQ_PASSWORD in .env - see .env.example}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - bjk-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  bjk-sql-data:
  bjk-rabbitmq-data:
