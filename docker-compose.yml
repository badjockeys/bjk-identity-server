# Local SQL Server for development (shared with bjk-core):  docker compose up -d
# It holds both databases (idsrv and badjockeys) and the message queues (schema messaging of badjockeys).
# The sa password comes from .env (git-ignored); copy .env.example to .env first.
# Data is kept in a Docker volume, so it survives restarts.
# To start again from empty:  docker compose down -v
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server only ships for x86-64; on Apple Silicon Docker Desktop runs it under Rosetta.
    platform: linux/amd64
    container_name: bjk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${BJK_SQL_PASSWORD:?Set BJK_SQL_PASSWORD in .env - see .env.example}
    ports:
      - "1433:1433"
    volumes:
      - bjk-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  bjk-sql-data:
